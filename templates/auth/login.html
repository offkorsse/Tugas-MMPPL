{% extends "base.html" %}
{% block title %}Login — Py-Learn{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm border-0 rounded-4 p-4">
      <div class="text-center mb-4">
        <i class="bi bi-code-square display-4 text-primary"></i>
        <h4 class="fw-bold mt-2">Py-Learn</h4>
        <p class="text-muted small">Selamat Datang di Aplikasi Pembelajaran Python</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">
            <i class="bi bi-person me-1"></i>Username
          </label>
          <input type="text" name="username" class="form-control" placeholder="contoh" required/>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold d-flex justify-content-between">
            <span><i class="bi bi-lock me-1"></i>Password</span>
            <a href="#" class="text-decoration-none small">Lupa?</a>
          </label>
          <div class="input-group">
            <input type="password" name="password" class="form-control" id="pwd" required/>
            <button class="btn btn-outline-secondary" type="button"
              onclick="togglePwd()"><i class="bi bi-eye" id="pwd-icon"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Masuk</button>
      </form>

      <p class="text-center mt-3 small text-muted">
        Belum punya akun?
        <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Buat akun baru</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePwd() {
  const p = document.getElementById('pwd');
  const i = document.getElementById('pwd-icon');
  p.type = p.type === 'password' ? 'text' : 'password';
  i.className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
</script>
{% endblock %}
